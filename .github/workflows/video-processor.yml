name: Video processor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: video-processor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs can run for at most six hours. The processor exits
    # after 350 minutes so it has a ten-minute window to requeue active work
    # before GitHub cancels the job.
    timeout-minutes: 360
    env:
      ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
      WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/video-processor/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install processor dependency
        run: python -m pip install -r workers/video-processor/requirements.txt

      - name: Verify FFmpeg
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders 2>&1 | grep -E "(^|[[:space:]])libx264([[:space:]]|$)"

      - name: Preflight orchestrator gateway
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          import requests

          raw = os.environ.get("ORCHESTRATOR_URL", "").strip()
          parsed = urlsplit(raw)
          if parsed.scheme != "https" or not parsed.netloc or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("ORCHESTRATOR_URL must be an HTTPS origin without a path, query, or fragment")

          base = raw.rstrip("/")
          health = requests.get(f"{base}/health", timeout=(10, 20))
          print(f"Orchestrator health: HTTP {health.status_code}")
          health.raise_for_status()

          probe = requests.get(
              f"{base}/v1/config",
              headers={"Authorization": "Bearer github-actions-preflight"},
              timeout=(10, 20),
          )
          print(f"Orchestrator authenticated route preflight: HTTP {probe.status_code}")
          if probe.status_code == 500:
              try:
                  payload = probe.json()
              except ValueError:
                  payload = {}
              if payload.get("error") == "worker_misconfigured":
                  missing = ", ".join(payload.get("missing", [])) or "unknown binding"
                  raise SystemExit(f"The deployed Cloudflare Worker is missing: {missing}")
          if probe.status_code == 500 and "1101" in probe.text:
              raise SystemExit("The deployed Cloudflare Worker threw an exception; check PANEL_URL and ORCHESTRATOR_SECRET in Worker secrets")
          if probe.status_code != 401:
              raise SystemExit(f"Unexpected orchestrator preflight response: HTTP {probe.status_code}")
          PY

      - name: Run processor
        # Keep polling for the full window, including while the queue is
        # temporarily empty. The concurrency group serializes scheduled runs.
        run: python workers/video-processor/processor.py --max-runtime 21000
