name: Video processor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: video-processor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
      WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/video-processor/requirements.txt

      - name: Install processor dependency
        run: python -m pip install -r workers/video-processor/requirements.txt

      - name: Verify FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Run processor
        run: python workers/video-processor/processor.py --max-runtime 19800 --exit-when-idle 120
